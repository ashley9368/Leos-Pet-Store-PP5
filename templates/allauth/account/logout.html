<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Sign Out</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
</head>

<body class="bg-white text-dark">

  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="text-center" style="max-width: 400px; width: 100%;">

      {% load i18n %}
      <h2 class="mb-4">{% trans "Sign Out" %}</h2>

      <p class="mb-4">{% trans 'Are you sure you want to sign out?' %}</p>

      <form method="post" action="{% url 'account_logout' %}">
        {% csrf_token %}
        {% if redirect_field_value %}
        <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
        {% endif %}

        <div class="d-flex justify-content-between">
          <a class="btn btn-outline-dark" href="{% url 'home' %}">Cancel</a>
          <button type="submit" class="btn btn-dark">{% trans "Sign Out" %}</button>
        </div>
      </form>

    </div>
  </div>
</body>
</html>
