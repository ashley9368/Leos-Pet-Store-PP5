<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />
  <title>Sign Up</title>
</head>

<body class="bg-white text-dark">

  {% load i18n %}

  {% block content %}
  <div class="d-flex flex-column justify-content-center align-items-center vh-100">
    <h1 class="mb-4">{% trans "Sign Up" %}</h1>

    <p>
      {% blocktrans %}
      If you already have an account then please
      <a href="{{ login_url }}" class="text-decoration-underline">sign in</a>
      {% endblocktrans %}
    </p>

    <form method="POST" action="{% url 'account_signup' %}">
      {% csrf_token %}
      {{ form|crispy }}
      {% if redirect_field_value %}
      <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}" />
      {% endif %}
      <button class="btn btn-dark btn-block mt-3" type="submit">{% trans "Sign Up" %}</button>
    </form>
  </div>
  {% endblock %}

</body>
</html>
