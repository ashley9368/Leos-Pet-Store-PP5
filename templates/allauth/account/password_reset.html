<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Password Reset</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
</head>

<body class="bg-white text-dark">
  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="w-100" style="max-width: 400px;">
      <h2 class="text-center mb-4">Password Reset</h2>

      {% load i18n %}
      {% load account %}
      {% if user.is_authenticated %}
      {% include "account/snippets/already_logged_in.html" %}
      {% endif %}

      <p class="mb-4">
        {% trans "Please enter your email below if you have forgotten your passowrd." %}
      </p>

      <form method="POST" action="{% url 'account_reset_password' %}">
        {% csrf_token %}
        <div class="form-group">
          <label for="id_email">{% trans "Email address" %}</label>
          <input type="email" name="email" id="id_email" required class="form-control border border-dark rounded-0 bg-white text-dark">
        </div>

        <div class="d-flex justify-content-between mt-4">
          <a href="{% url 'home' %}" class="btn btn-outline-dark">Home</a>
          <button type="submit" class="btn text-white" style="background-color: #000;">
            {% trans "Reset My Password" %}
          </button>
        </div>
      </form>
      <p class="mt-4 text-center small"><a href="{% url 'home' %}">{% trans "Back to Home" %}</a></p>
    </div>
  </div>

</body>
</html>
