<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Newsletter Signup</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
    integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous" />
</head>

<body class="bg-white">
  <div class="container my-5 d-flex justify-content-center">
    <div class="w-100" style="max-width: 400px;">
      {% if messages %}
      <div>
        {% for message in messages %}
        <div class="alert alert-dark text-center font-weight-bold" role="alert">
          {{ message }}
        </div>
        {% endfor %}
      </div>
      {% endif %}

      <!-- Subscribe -->
      <form action="{% url 'subscribe' %}" method="POST" class="p-4 border border-dark rounded">
        {% csrf_token %}
        <div class="form-group">
          <label for="email" class="font-weight-bold d-block mb-2">
            Subscribe to our newsletter!
          </label>
          <input type="email" id="email" name="email" class="form-control border-dark" placeholder="your email address "
            required />
        </div>
        <button type="submit" class="btn btn-block mt-3" style="background-color: #000000; color: #ffffff;">
          Subscribe
        </button>
      </form>

      <!-- Unsubscribe -->
      {% if subscriber %}
      <form action="{% url 'unsubscribe' subscriber.unsubscribe_token %}" method="POST" class="text-center mt-3">
        {% csrf_token %}
        <button type="submit" class="btn mt-2" style="background-color: #000000; color: #ffffff;">I want to
          unsubscribe</button>
      </form>
      {% endif %}

      <div class="text-center mt-4">
        <a href="{% url 'products' %}" class="btn mt-2" style="background-color: #000000; color: #ffffff;">Return To
          Home</a>
      </div>

    </div>
  </div>

</body>

</html>
