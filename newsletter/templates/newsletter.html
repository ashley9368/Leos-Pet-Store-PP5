{% extends "base.html" %}
{% load static %}

{% block extra_title %} Newsletter {% endblock %}

{% block extra_css %}
<link href="//cdn-images.mailchimp.com/embedcode/classic-061523.css" rel="stylesheet" type="text/css">
{% endblock %}

{% block page_header %}
<div class="header-container">
  <div class="row">
    <div class="col"></div>
  </div>
</div>
{% endblock %}

<!-- Mail Chimp code -->
{% block content %}
<div class="overlay"></div>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

      <div id="mc_embed_signup">
        <form
          action="https://herokuapp.us14.list-manage.com/subscribe/post?u=e5d603184e32099cbb5e01481&amp;id=008891aef5&amp;f_id=00944de5f0"
          method="post" id="mc-embedded-subscribe-form" name="mc-embedded-subscribe-form" class="validate">

          <div id="mc_embed_signup_scroll">
            <h2>Subscribe</h2>

            <div class="indicates-required">
              <span class="asterisk">*</span> indicates required
            </div>

            <div class="mc-field-group">
              <label for="mce-EMAIL">
                Email Address <span class="asterisk">*</span>
              </label>
              <input type="email" name="EMAIL" class="required email" id="mce-EMAIL" required>
            </div>

            <div id="mce-responses" class="clear">
              <div class="response" id="mce-error-response" style="display:none;"></div>
              <div class="response" id="mce-success-response" style="display:none;"></div>
            </div>

            <div aria-hidden="true" style="position:absolute; left:-5000px;">
              <input type="text" name="b_e5d603184e32099cbb5e01481_008891aef5" tabindex="-1">
            </div>

            <div class="clear">
              <input type="submit" value="Subscribe" name="subscribe" id="mc-embedded-subscribe" class="button">
            </div>

          </div>
        </form>
      </div>

    </div>
  </div>
</div>
{% endblock %}

<!--  Mailchimp scripts-->
{% block postloadjs %}
<script type="text/javascript" src="//s3.amazonaws.com/downloads.mailchimp.com/js/mc-validate.js"></script>
<script
  type="text/javascript">(function ($) { window.fnames = new Array(); window.ftypes = new Array(); fnames[0] = 'EMAIL'; ftypes[0] = 'email'; }(jQuery)); var $mcj = jQuery.noConflict(true);</script>
</div>
{% endblock %}
