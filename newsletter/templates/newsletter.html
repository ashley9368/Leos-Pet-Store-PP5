{% if messages %}
  <ul>
    {% for message in messages %}
      <li>{{ message }}</li>
    {% endfor %}
  </ul>
{% endif %}

<form action="{% url 'subscribe' %}" method="POST">
  {% csrf_token %}
  <label for="email">Subscribe to our newsletter to stay up to date!</label>
  <input type="email" id="email" name="email" required>
  <button type="submit">Subscribe</button>
</form>

{% if subscriber %}
  <form action="{% url 'unsubscribe' subscriber.unsubscribe_token %}" method="POST">
    {% csrf_token %}
    <button type="submit">Unsubscribe</button>
  </form>
{% endif %}
