<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Newsletter Signup</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
    integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous" />
</head>

<body class="bg-white text-dark">
  <div class="container my-5 d-flex justify-content-center">
    <div class="w-100" style="max-width: 400px;">
      {% if messages %}
      <div>
        {% for message in messages %}
        <div class="alert alert-dark text-center" role="alert">
          {{ message }}
        </div>
        {% endfor %}
      </div>
      {% endif %}

      <!-- Subscribe -->
      <form action="{% url 'subscribe' %}" method="POST" class="p-4 border border-dark rounded bg-white text-dark">
        {% csrf_token %}
        <div class="form-group">
          <label for="email" class="font-weight-bold d-block mb-2">
            Subscribe to our newsletter!
          </label>
          <input type="email" id="email" name="email" class="form-control border-dark" placeholder="your email address "required/>
        </div>
        <button type="submit" class="btn btn-dark btn-block mt-3">
          Subscribe
        </button>
      </form>

      <!-- Unsubscribe -->
      {% if subscriber %}
      <form action="{% url 'unsubscribe' subscriber.unsubscribe_token %}" method="POST" class="text-center mt-3">
        {% csrf_token %}
        <button type="submit" class="btn btn-outline-dark">I want to unsubscribe</button>
      </form>
      {% endif %}
    </div>
  </div>

</body>
</html>
